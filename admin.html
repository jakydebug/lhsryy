<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站后台管理</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrap{max-width:900px;margin:3rem auto;padding:2rem;}
        .form-item{margin:1.2rem 0;}
        label{display:block;margin-bottom:0.5rem;font-weight:500;}
        input,textarea{width:100%;padding:0.8rem;border-radius:10px;border:1px solid #333;background:#161b22;color:#eee;font-size:1rem;}
        textarea{min-height:120px;resize:vertical;}
        .btn-group{display:flex;gap:1rem;margin-top:2rem;flex-wrap:wrap;}
        button{padding:0.8rem 1.4rem;border:none;border-radius:10px;background:#388bff;color:#fff;cursor:pointer;font-size:1rem;transition:0.2s;}
        button:hover{background:#2574e0;}
        .btn-danger{background:#ff4757;}
        .btn-danger:hover{background:#e63946;}
        .tip{color:#aaa;font-size:0.9rem;margin:0.4rem 0;}
        .json-box{margin-top:1rem;}
    </style>
</head>
<body>
    <div class="admin-wrap">
        <h1>网站内容管理后台</h1>
        <p class="tip">修改内容后点【保存到本地】，数据存在浏览器；修改完成后【导出JSON】，把JSON里的配置更新到 main.js 默认配置，再推送到 GitHub 生效！</p>
        <a href="index.html">← 返回主页</a>
        <hr>

        <div class="form-item">
            <label>网站名称</label>
            <input type="text" id="inp-name">
        </div>
        <div class="form-item">
            <label>副标题</label>
            <input type="text" id="inp-subtitle">
        </div>
        <div class="form-item">
            <label>社交链接（一行一个，格式：名称|链接）</label>
            <textarea id="inp-social"></textarea>
        </div>
        <div class="form-item">
            <label>关于我</label>
            <textarea id="inp-about"></textarea>
        </div>
        <div class="form-item">
            <label>项目列表（一行一个，格式：标题|描述|链接）</label>
            <textarea id="inp-projects"></textarea>
        </div>

        <div class="btn-group">
            <button onclick="saveConfig()">保存到本地</button>
            <button onclick="loadConfig()">读取配置</button>
            <button onclick="exportJson()">导出JSON</button>
            <button class="btn-danger" onclick="clearConfig()">清空本地</button>
        </div>

        <div class="json-box">
            <h3>导出配置</h3>
            <textarea id="out-json" readonly></textarea>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
